[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-reduction"
version = "0.1.0"
description = "Image deduplication and resolution-variant detection tool"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",
    "imagehash>=4.3",
    "numpy>=1.24",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
oracle-reduction = "oracle_reduction.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_reduction"]

[tool.pytest.ini_options]
testpaths = ["__tests__"]
addopts = "-v"

[tool.coverage.run]
source = ["src/oracle_reduction"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100
